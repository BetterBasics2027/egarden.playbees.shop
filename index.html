<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Playbees &amp; KiddyDoo Wholesale Catalog</title>
<meta name="description" content="Playbees and KiddyDoo wholesale catalogs: squishies, slime, party favors, games, outdoor toys and more, with wholesale pricing. Download the PDF or build an order request from your phone.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFF6E2">
<meta property="og:title" content="Playbees &amp; KiddyDoo Wholesale Catalog">
<meta property="og:description" content="Playbees and KiddyDoo wholesale pricing. Pick quantities and send an order request, or download the PDF catalog.">
<link rel="icon" href="img/playbees-logo.png">
<link rel="apple-touch-icon" href="img/playbees-logo.png">
<link rel="preload" href="fonts/fredoka-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/nunito-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css?v=6">
</head>
<body>

<header class="top">
  <a class="toplogo" id="toplogo" href="#top" aria-label="Back to top, switch catalogs"><img id="toplogo-img" src="img/playbees-logo.png" alt="Playbees"></a>
  <a class="pdfbtn" id="pdfbtn" href="#" download><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg><span>PDF</span></a>
  <button class="cartbtn" id="cartbtn" aria-label="Open order">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.6 12.4a1 1 0 0 0 1 .8h9.9a1 1 0 0 0 1-.8L21 8H6.3"/><circle cx="9.5" cy="20.5" r="1.3"/><circle cx="17.5" cy="20.5" r="1.3"/></svg>
    <span>Order</span><span class="n" id="cartcount">0</span>
  </button>
</header>

<section class="hero" id="top">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
  <div class="eyebrow" id="eyebrow">Wholesale Pricing</div>
  <div class="herobrands" id="herobrands" role="group" aria-label="Choose a catalog"></div>
  <div class="herohint">Tap a logo to switch catalogs</div>
  <h1>Wholesale Catalog</h1>
  <p id="subtitle"></p>
  <a class="pdfbig" id="pdfbig" href="#" download><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg><span id="pdfbig-t">Download the PDF catalog</span></a>
  <div class="mosaic" id="mosaic"></div>
  <div class="chips" id="chips"></div>
  <div class="how"><span><b>1</b> Browse</span><span><b>2</b> Set quantities</span><span><b>3</b> Send your order request</span></div>
</section>

<div class="toolbar" id="toolbar">
  <div class="toolrow">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search 67 items&hellip; (name, PB number)" autocomplete="off" aria-label="Search items">
      <button class="clr" id="qclr" aria-label="Clear search" hidden>&times;</button>
    </label>
    <div class="seg" role="group" aria-label="View">
      <button id="vgrid" aria-pressed="true"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg><span>Photos</span></button>
      <button id="vlist" aria-pressed="false"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="4" width="18" height="3.5" rx="1.5"/><rect x="3" y="10.25" width="18" height="3.5" rx="1.5"/><rect x="3" y="16.5" width="18" height="3.5" rx="1.5"/></svg><span>Price list</span></button>
    </div>
  </div>
  <nav class="navstrip" id="navstrip" aria-label="Categories"></nav>
</div>

<main id="catalog" aria-live="polite"></main>

<footer id="contact">
  <div class="who" id="c-name"></div>
  <div class="role" id="c-title"></div>
  <div class="cta">
    <a id="c-tel" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg><span id="c-phone"></span></a>
    <a id="c-mail" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><span id="c-email"></span></a>
  </div>
  <p class="note" id="note"></p>
  <div class="brand">Playbees &middot; KiddyDoo</div>
</footer>

<div class="bottombar" id="bottombar">
  <div class="l"><span id="bb-packs"></span><b id="bb-total"></b></div>
  <button id="bb-open">View order</button>
</div>

<div class="scrim" id="scrim"></div>

<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
  <div class="dhead"><h2 id="drawer-title">Your order request</h2><button class="x" id="drawer-x" aria-label="Close">&times;</button></div>
  <div class="dbody" id="dbody"></div>
  <div class="dfoot" id="dfoot"></div>
</aside>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Item details">
  <div class="grab"></div>
  <button class="x" id="sheet-x" aria-label="Close">&times;</button>
  <div class="sbody" id="sbody"></div>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="config.js?v=6"></script>
<script src="app.js?v=6"></script>
</body>
</html>
